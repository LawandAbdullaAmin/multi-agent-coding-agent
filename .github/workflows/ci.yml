name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      # The tests do not call any model; the placeholder key is only needed to construct the clients
      - run: pytest -q
        env:
          OPENAI_API_KEY: sk-placeholder-not-used
