name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Die Tests rufen kein Modell auf; der Platzhalter-Schlüssel wird nur für den Aufbau der Clients gebraucht
      - run: pytest -q
        env:
          OPENAI_API_KEY: sk-placeholder-not-used
