name: Website

# Veröffentlicht die Oberfläche als statische Vorschau auf GitHub Pages (simulierter Lauf, kein Server, keine Kosten)
on:
  push:
    branches: [main]
    paths: ["coding_agent/web/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp coding_agent/web/static/index.html _site/
          cp -r coding_agent/web/static _site/static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
